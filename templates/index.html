<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - AI Project</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🤖 AI Project</h1>
            <p class="tagline">Ask anything. Local LLM answers with references.</p>
            <button id="darkToggle" class="btn btn-secondary" style="margin-top:10px" onclick="toggleDarkMode()">Toggle Dark</button>
        </div>
    </header>

    <main class="container">
        <section class="landing" id="landing">
                <h2>What are you thinking about?</h2>
                <p class="description">Ask anything. We'll fetch useful info and draft a concise answer with references.</p>
                <div class="prompt-row">
                    <input id="userPrompt" type="text" placeholder="e.g., Is creatine safe for endurance athletes?" onkeydown="if(event.key==='Enter'){ask()}" />
                    <button class="btn btn-primary" onclick="ask()">Ask</button>
                </div>
            </section>

            <section id="results" class="results" style="display:none">
                <div class="results-columns">
                    <div class="left">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                            <h3 style="margin: 0;">Prompt</h3>
                            <button class="btn" onclick="resetUI()" style="padding: 0.5rem 1rem; font-size: 0.9rem;">New question</button>
                        </div>
                        <div id="promptEcho" class="card"></div>
                        <h3 style="margin-top: 1.5rem;">References</h3>
                        <ul id="refList" class="links"></ul>
                        <div id="videoBox" class="video-gallery" style="display:none; margin-top:1rem;"></div>
                        <div id="imageBox" class="image-gallery" style="display:none; margin-top:1rem;"></div>
                    </div>
                    <div class="right">
                        <h3>Answer</h3>
                        <div id="answerBox" class="card"></div>
                        <div id="bulletBox" class="card" style="display:none; margin-top:10px;"></div>
                    </div>
                </div>
            </section>
    </main>

    <!-- Lightbox for images -->
    <div id="lightbox" class="lightbox-overlay" style="display:none" role="dialog" aria-modal="true" aria-label="Image preview">
        <div class="lightbox-content">
            <button class="lightbox-close" aria-label="Close image" onclick="hideLightbox()">&times;</button>
            <img id="lightboxImage" alt="Preview" />
            <p id="lightboxCaption" class="lightbox-caption"></p>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 AI Project. Powered by intelligent agents.</p>
        </div>
    </footer>

    <script>
        function showResultsLayout(prompt) {
            const landing = document.getElementById('landing');
            const results = document.getElementById('results');
            document.getElementById('promptEcho').textContent = prompt;
            landing.style.display = 'none';
            results.style.display = 'block';
        }

        async function ask() {
            const prompt = document.getElementById('userPrompt').value.trim();
            if (!prompt) return;
            showResultsLayout(prompt);
            const answerBox = document.getElementById('answerBox');
            const bulletBox = document.getElementById('bulletBox');
            const refList = document.getElementById('refList');
            answerBox.innerHTML = '<div class="spinner"></div> Thinking…';
            refList.innerHTML = '';
            bulletBox.style.display = 'none';
            const imageBox = document.getElementById('imageBox');
            imageBox.style.display = 'none';
            imageBox.innerHTML = '';
            const videoBox = document.getElementById('videoBox');
            videoBox.style.display = 'none';
            videoBox.innerHTML = '';
            const askBtn = document.querySelector('.prompt-row .btn.btn-primary');
            if (askBtn) { askBtn.disabled = true; askBtn.textContent = 'Working…'; }
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 30000);
            try {
                const resp = await fetch('/api/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt }),
                    signal: controller.signal
                });
                const data = await resp.json();
                if (data.status !== 'success') throw new Error('Request failed');
                answerBox.textContent = data.answer || '';
                // Bullets
                const bullets = data.bullets || [];
                if (bullets.length) {
                    bulletBox.style.display = 'block';
                    bulletBox.innerHTML = '<ul class="bullets">' + bullets.map(b => `<li>${b}</li>`).join('') + '</ul>';
                }
                // Links
                (data.links || []).forEach(url => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = url;
                    li.appendChild(a);
                    refList.appendChild(li);
                });
                // YouTube Videos
                const videos = data.videos || [];
                if (videos.length) {
                    videoBox.style.display = 'block';
                    videoBox.innerHTML = videos.map(video => 
                        `<div class="video-item">
                            <iframe 
                                width="100%" 
                                height="315" 
                                src="https://www.youtube.com/embed/${video.video_id}" 
                                title="${video.title}" 
                                frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                allowfullscreen
                                loading="lazy">
                            </iframe>
                            <p class="video-title">${video.title}</p>
                        </div>`
                    ).join('');
                }
                // Images (click to open lightbox)
                const images = data.images || [];
                if (images.length) {
                    imageBox.style.display = 'block';
                    imageBox.innerHTML = images.map(img => 
                        `<button class="image-item" type="button" data-url="${img.url}" data-title="${img.title.replace(/"/g,'&quot;')}">
                            <img src="${img.thumbnail}" alt="${img.title}" loading="lazy" />
                        </button>`
                    ).join('');
                }
            } catch (e) {
                if (e.name === 'AbortError') {
                    answerBox.textContent = 'Request timed out. Please try again with a shorter or clearer prompt.';
                } else {
                    answerBox.textContent = 'Error: ' + e.message;
                }
            }
            finally {
                clearTimeout(timer);
                if (askBtn) { askBtn.disabled = false; askBtn.textContent = 'Ask'; }
            }
        }

        function resetUI() {
            document.getElementById('userPrompt').value = '';
            document.getElementById('landing').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            document.getElementById('answerBox').textContent = '';
            document.getElementById('bulletBox').style.display = 'none';
            document.getElementById('videoBox').style.display = 'none';
            document.getElementById('imageBox').style.display = 'none';
            document.getElementById('refList').innerHTML = '';
            document.getElementById('userPrompt').focus();
            hideLightbox();
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark');
        }

        // Keyboard shortcuts
        window.addEventListener('keydown', (e) => {
            // Focus prompt with '/'
            if (e.key === '/' && document.activeElement.id !== 'userPrompt') {
                e.preventDefault();
                const input = document.getElementById('userPrompt');
                input.focus();
                input.select();
            }
            // Escape to reset to landing view
            if (e.key === 'Escape') {
                // If lightbox open, close it, otherwise reset UI
                const lb = document.getElementById('lightbox');
                if (lb && lb.style.display !== 'none') {
                    hideLightbox();
                } else {
                    resetUI();
                }
            }
            // Ctrl+Enter to ask
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                ask();
            }
        });

        // Lightbox logic
        function showLightbox(url, title='') {
            const lb = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImage');
            const cap = document.getElementById('lightboxCaption');
            img.src = url;
            img.alt = title || 'Preview';
            cap.textContent = title || '';
            lb.style.display = 'flex';
            document.body.classList.add('no-scroll');
            // focus close for accessibility
            const closeBtn = lb.querySelector('.lightbox-close');
            if (closeBtn) closeBtn.focus();
        }

        function hideLightbox() {
            const lb = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImage');
            const cap = document.getElementById('lightboxCaption');
            lb.style.display = 'none';
            document.body.classList.remove('no-scroll');
            img.src = '';
            cap.textContent = '';
        }

        // Delegate clicks within image gallery to open lightbox
        const imgGallery = document.getElementById('imageBox');
        if (imgGallery) {
            imgGallery.addEventListener('click', (e) => {
                const item = e.target.closest('.image-item');
                if (!item) return;
                const url = item.getAttribute('data-url');
                const title = item.getAttribute('data-title') || '';
                if (url) showLightbox(url, title);
            });
        }

        // Close lightbox when clicking outside content
        const lbOverlay = document.getElementById('lightbox');
        if (lbOverlay) {
            lbOverlay.addEventListener('click', (e) => {
                if (e.target.id === 'lightbox' || e.target.classList.contains('lightbox-overlay')) {
                    hideLightbox();
                }
            });
        }
        async function generateLanding() {
            const prompt = document.getElementById('userPrompt').value.trim();
            const tone = document.getElementById('tone').value;
            if (!prompt) { alert('Please enter an idea.'); return; }
            
            try {
                const res = await fetch('/api/page/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt, tone, style: 'clean' })
                });
                const data = await res.json();
                if (data.status !== 'success') throw new Error('Generation failed');
                
                // Open a new window and write the HTML result
                const w = window.open('', '_blank');
                w.document.open();
                w.document.write(data.html);
                w.document.close();
            } catch (e) {
                alert('Error generating page: ' + e.message);
            }
        }
        // Agent interaction functions
        function viewAgent(agentName) {
            console.log('Viewing agent:', agentName);
            alert(`${agentName} details will be displayed here.`);
        }

        async function runSEOAnalysis() {
            const url = prompt('Enter URL to analyze:');
            if (!url) return;
            
            try {
                const response = await fetch('/api/seo/analyze', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url})
                });
                const data = await response.json();
                alert('SEO Analysis Result: ' + JSON.stringify(data, null, 2));
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function generateContent() {
            const topic = prompt('Enter content topic:');
            if (!topic) return;
            
            try {
                const response = await fetch('/api/content/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({topic, style: 'professional'})
                });
                const data = await response.json();
                alert('Generated Content:\n\n' + data.content);
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function checkRevenue() {
            try {
                const response = await fetch('/api/monetization/revenue/month');
                const data = await response.json();
                alert('Revenue Analysis:\n\n' + JSON.stringify(data.data, null, 2));
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function auditUX() {
            alert('UX Audit feature coming soon!');
        }

        async function getSiteHealth() {
            try {
                const response = await fetch('/api/oversight/health');
                const data = await response.json();
                alert('Site Health Report:\n\n' + JSON.stringify(data.health, null, 2));

        // UI/UX Analytics Tracking
        async function trackInteraction(eventType, elementId, metadata = {}) {
            try {
                await fetch('/api/uiux/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        event_type: eventType,
                        element_id: elementId,
                        metadata: metadata
                    })
                });
            } catch (e) {
                console.warn('Failed to track interaction:', e);
            }
        }

        // Track page load time
        window.addEventListener('load', () => {
            const loadTime = performance.now();
            trackInteraction('time', 'page_load', { load_time_ms: loadTime });
        });

        // Track scroll depth
        let maxScrollDepth = 0;
        window.addEventListener('scroll', () => {
            const scrollPercent = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
            if (scrollPercent > maxScrollDepth) {
                maxScrollDepth = scrollPercent;
                trackInteraction('scroll', 'page', { scroll_depth: scrollPercent });
            }
        });

        // Track button clicks
        document.addEventListener('click', (e) => {
            const target = e.target.closest('button, .btn');
            if (target) {
                const btnText = target.textContent.trim();
                const btnId = target.id || btnText.toLowerCase().replace(/\s+/g, '_');
                trackInteraction('click', btnId, { text: btnText });
            }
        });

        // Track input focus and queries
        const promptInput = document.getElementById('userPrompt');
        if (promptInput) {
            promptInput.addEventListener('focus', () => {
                trackInteraction('input', 'prompt_focus', {});
            });
            
            // Track search queries when submitted
            promptInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && promptInput.value.trim()) {
                    trackInteraction('input', 'search_query', { query: promptInput.value.trim() });
                }
            });
        }

            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
